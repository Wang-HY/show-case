<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>客商信息与客户画像 · FMS</title>
  <style>
    :root { --ink:#2d3c65; --ink-2:#243052; --muted:#6a8090; --soft:#f3f4f6; --line:#e5e8ed; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { background:#fff; color:#16303f; font:14px/1.55 "PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
    button { font:inherit; cursor:pointer; }
    .topbar { height:50px; padding:0 18px; display:flex; align-items:center; gap:14px; position:relative; z-index:3; background:#fff; color:var(--ink); border-bottom:1px solid #e8ebf0; }
    .brand { display:flex; align-items:center; gap:11px; font-weight:700; }
    .brand-mark { width:30px; height:30px; display:grid; place-items:center; border-radius:9px; background:linear-gradient(135deg,#405386,var(--ink)); color:#fff; }
    .brand-divider { width:1px; height:22px; margin:0 4px; background:#d9dee7; }
    .brand-fms { font-size:18px; }
    .top-spacer { flex:1; }
    .top-actions { display:flex; align-items:center; gap:8px; }
    .top-tool { min-width:31px; height:31px; padding:0 8px; display:grid; place-items:center; border:1px solid transparent; border-radius:5px; background:#fff; color:var(--ink); }
    .top-tool:hover { background:#f5f7fa; border-color:#e1e6ed; }
    .company-switch { border-color:#d9dee7; color:var(--muted); font-size:12px; white-space:nowrap; }
    .avatar { width:30px; height:30px; display:grid; place-items:center; border-radius:50%; background:#4e73c8; color:#fff; font-weight:700; }
    .sidebar { position:fixed; left:0; top:50px; bottom:0; z-index:2; width:72px; padding:10px 0; overflow-y:auto; background:var(--ink); color:#c9d2e6; }
    .side-item { width:100%; min-height:64px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border:0; border-left:3px solid transparent; background:transparent; color:inherit; font-size:12px; }
    .side-item:hover { background:rgba(255,255,255,.07); color:#fff; }
    .side-item.active { background:var(--ink-2); border-left-color:#5e86cc; color:#fff; }
    .side-icon { font-size:17px; line-height:1; }
    .workspace-tabs { height:43px; margin-left:72px; padding:0 18px; display:flex; align-items:flex-end; gap:3px; position:relative; z-index:2; background:var(--soft); border-bottom:1px solid var(--line); overflow-x:auto; }
    .workspace-tab { height:35px; padding:0 17px; display:flex; align-items:center; gap:11px; border:0; border-radius:6px 6px 0 0; background:transparent; color:#59677a; white-space:nowrap; font-size:12px; }
    .workspace-tab:hover { background:rgba(255,255,255,.55); color:var(--ink); }
    .workspace-tab.active { background:#fff; color:var(--ink); font-weight:600; }
    .tab-close { color:#9aa4b1; font-weight:400; }
    .view-host { height:calc(100vh - 93px); margin-left:72px; position:relative; background:#fff; }
    .page-frame { width:100%; height:100%; display:block; border:0; background:#fff; }
    .page-frame[hidden] { display:none; }
    .loading { position:absolute; inset:0; display:grid; place-items:center; color:#95a8b4; background:#fff; font-size:12px; pointer-events:none; }
    .loading.hidden { display:none; }
    @media (max-width:720px) {
      .optional, .company-switch, .sidebar { display:none; }
      .workspace-tabs { margin-left:0; padding:0 8px; }
      .view-host { margin-left:0; }
      .workspace-tab { flex:1; justify-content:center; }
    }
  </style>
</head>

    <div class="top-actions">
      <button class="top-tool company-switch" type="button">业务工作台⌄</button>
      <button class="top-tool optional" type="button" aria-label="工作台">▣</button>
      <button class="top-tool optional" type="button" aria-label="应用中心">◇</button>
      <button class="top-tool optional" type="button" aria-label="通知">♧</button>
      <div class="avatar">销</div>
    </div>
  </header>

    <button class="side-item" type="button"><span class="side-icon">⌕</span><span>搜索</span></button>

    <button class="side-item" type="button"><span class="side-icon">⌂</span><span>仓储</span></button>

  </nav>

      };
      const loaded = new Set();
      const frameOverrides = `<style id="combined-page-overrides">
        .topbar, .sidebar, .workspace-tabs { display:none !important; }
        .shell { margin-left:0 !important; }
        body { min-height:100vh !important; }
        @media (max-width:720px) { .shell { margin-left:0 !important; } }
      </style>`;

      function decodeUtf8(base64) {
        const bytes = Uint8Array.from(atob(base64), character => character.charCodeAt(0));
        return new TextDecoder('utf-8').decode(bytes);
      }

      function load(view) {
        if (loaded.has(view)) return;
        const frame = document.getElementById(`${view}Frame`);
        const html = decodeUtf8(sources[view]).replace('</head>', `${frameOverrides}</head>`);
        frame.addEventListener('load', () => document.getElementById('loading').classList.add('hidden'), { once:true });
        frame.srcdoc = html;
        loaded.add(view);
      }

      function activate(view, updateHash = true) {
        document.querySelectorAll('.workspace-tab').forEach(tab => {
          const active = tab.dataset.view === view;
          tab.classList.toggle('active', active);
          tab.setAttribute('aria-selected', String(active));
        });
        document.querySelectorAll('.page-frame').forEach(frame => { frame.hidden = frame.id !== `${view}Frame`; });
        document.getElementById('loading').classList.toggle('hidden', loaded.has(view));
        load(view);
        if (updateHash) history.replaceState(null, '', view === 'merchant' ? '#客商信息' : '#客户画像');
      }

      document.querySelectorAll('.workspace-tab').forEach(tab => tab.addEventListener('click', () => activate(tab.dataset.view)));
      const initialView = decodeURIComponent(location.hash) === '#客商信息' ? 'merchant' : 'portrait';
      activate(initialView, false);
    })();
  </script>
